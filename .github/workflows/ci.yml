name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on:  ubuntu-latest

    services:
      postgres:
        image: postgres-16
        env:
          POSTGRES_USER: vishnuvardhan
          POSTGRES_PASSWORD: password
          POSTGRES_DB: node_learning_test 
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U vishnuvardhan -d node_learning_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://vishnuvardhan:password@localhost:5432/node_learning_test
      ACCESS_TOKEN_SECRET: test_access_secret
      REFRESH_TOKEN_SECRET: test_refresh_secret
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t node-learning-api .
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      
      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma migrate
        run: npx prisma migrate deploy

      - name: Run tests
        run: npm test -- --runInBand